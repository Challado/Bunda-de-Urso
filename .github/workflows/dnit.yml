name: DNIT ao vivo (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coleta:
    name: API publica real, sem Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Baixar e validar GeoJSON pelo coletor de producao
        run: python .github/scripts/diagnosticar_dnit.py
      - name: Relatorio e dados recebidos da API publica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnit-ao-vivo
          path: test-results/dnit-ao-vivo/
          retention-days: 7
          if-no-files-found: error
