name: Validação

# RÍGIDO: pega tudo que possa virar cagada no repositório.
#   1. Suíte de testes completa, com PISO de testes ("verde vazio" reprova);
#   2. paridade dos esquemas SQLite × PostgreSQL e DDL que executa de verdade;
#   3. JSONs válidos e sem chave repetida;
#   4. segredos e arquivos sensíveis versionados;
#   5. integridade do front (recursos, viewport, contrato com a API);
#   6. ninguém escreve direto no banco fora de core/db.py;
#   7. estrutura (arquivos obrigatórios, nenhum artefato versionado).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suíte de testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Versão do Python
        run: python -V
      - name: Dependências do sistema (poppler, logrotate e nginx)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils logrotate nginx
          pdftotext -v 2>&1 | head -1
      - name: Sintaxe (compileall)
        run: python -m compileall -q core coletor tools web tests .github/scripts
      - name: Suíte de testes (com piso)
        run: python .github/scripts/rodar_suite.py

  rigido:
    name: Rígido (contratos e invariantes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verificadores (sintaxe)
        run: python -m compileall -q .github/scripts
      - name: Paridade dos esquemas SQL (SQLite × PostgreSQL)
        run: python .github/scripts/verificar_sql.py
      - name: JSONs (válidos, sem chave repetida)
        run: python .github/scripts/verificar_json.py
      - name: Segredos e arquivos sensíveis
        run: python .github/scripts/verificar_segredos.py
      - name: Integridade do front (recursos, viewport, rotas)
        run: python .github/scripts/verificar_web.py
      - name: Escrita no banco (só por core/db.py; painel só por API)
        run: python .github/scripts/verificar_banco.py
      - name: "Caminhos (porta única: core.caminhos + /etc/radar-brasil/radar.conf)"
        run: python .github/scripts/verificar_caminhos.py
      - name: Estrutura do repositório
        run: python .github/scripts/verificar_estrutura.py
