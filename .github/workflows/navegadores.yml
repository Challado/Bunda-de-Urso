name: Navegadores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navegadores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadastro:
    name: Fluxos funcionais e home (${{ matrix.browser }})
    # Playwright 1.58.2 suporta 24.04; ubuntu-latest migrou para 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chromium]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar navegador e dependências no runner
        run: |
          NAVEGADOR=""
          if [[ "${{ matrix.browser }}" == chromium ]]; then
            for CANDIDATO in chromium chromium-browser google-chrome google-chrome-stable; do
              if command -v "$CANDIDATO" >/dev/null; then
                NAVEGADOR="$(command -v "$CANDIDATO")"
                break
              fi
            done
          fi
          if [[ -n "$NAVEGADOR" ]]; then
            "$NAVEGADOR" --version
            printf 'RADAR_TEST_CHROMIUM=%s\n' "$NAVEGADOR" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Fluxos completos, home e API CGI (desktop e tela estreita)
        run: npx playwright test --project="${{ matrix.browser }}-*"
      - name: Relatório, capturas e rastreamentos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navegador-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
