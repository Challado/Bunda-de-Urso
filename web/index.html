<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Brasil — consulta por localização</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--azul:#12508f;--vermelho:#c0392b;--cinza:#f4f4f6;--borda:#d7d7de;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1d1d22}
  header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
  header .logo{height:54px;width:auto;border-radius:8px;background:#fff;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.3);flex:0 0 auto}
  header .cabTxt{min-width:0}
  header .nav{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  header .nav a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45);font-size:13.5px;font-weight:600;padding-bottom:1px}
  header .nav a:hover{border-bottom-color:#fff}
  header h1{margin:0;font-size:17px;font-weight:600}
  header .sub{opacity:.85;font-size:12.5px}
  /* position+z-index: a barra de controles precisa ficar ACIMA do mapa. O Leaflet usa
     z-index ate 1000 (controles/paneis); sem isso o autocomplete de municipio e encoberto
     pelo mapa no PC (a lista "nao aparece"). */
  #controles{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 16px;background:var(--cinza);border-bottom:1px solid var(--borda);position:relative;z-index:1100}
  #controles label{display:flex;flex-direction:column;font-size:12px;color:#4a4a55;gap:2px}
  #controles input[type=number],#controles input[type=text]{padding:6px 8px;border:1px solid var(--borda);border-radius:6px;width:150px;font:inherit}
  #controles input[type=range]{width:220px;padding:0;margin-top:6px;accent-color:var(--azul)}
  #controles .munBox input{width:230px}
  #controles .raioVal{font-weight:600;color:var(--azul)}
  button{padding:7px 12px;border:0;border-radius:6px;background:var(--azul);color:#fff;font:inherit;cursor:pointer}
  button.sec{background:#5b6472}
  .ctrlAqui button{background:#fff;color:var(--azul);border:2px solid rgba(0,0,0,.25);border-radius:6px;padding:7px 10px;font:600 13px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4);white-space:nowrap}
  .ctrlAqui button:hover{background:#eef3f9}
  #dicaAqui{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:1100;background:rgba(18,80,143,.94);color:#fff;border:0;border-radius:20px;padding:8px 14px;font:600 13px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #dicaAqui.on{display:block}
  button:disabled{opacity:.55;cursor:default}
  .chk{flex-direction:row!important;align-items:center;gap:5px!important;font-size:12.5px}
  #mapa{height:64vh;min-height:360px;width:100%}
  #mapaBox{position:relative}
  #barra{padding:8px 16px;font-size:13px;color:#4a4a55}
  #barra b{color:#1d1d22}
  #resultado{padding:0 16px 24px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--borda);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:var(--cinza);position:sticky;top:0}
  .pill{display:inline-block;background:#e8eef6;color:var(--azul);border-radius:10px;padding:1px 8px;font-size:12px}
  #legenda{padding:6px 16px 0;font-size:12.5px;color:#4a4a55;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  #legenda .lg{display:inline-flex;align-items:center;gap:6px}
  #legenda i{width:14px;height:14px;border-radius:50%;border:2px solid #000;display:inline-block}
  .selo-nosso{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
  .aviso{background:#fff4e5;border:1px solid #ffd08a;border-radius:6px;padding:8px 10px;font-size:13px}
  /* ---- festa: quando nao ha nenhum equipamento no raio ---- */
  #festa{position:fixed;inset:0;z-index:10000;display:none;overflow:hidden;background:rgba(255,255,255,.82);cursor:pointer}
  #festa.on{display:block}
  #festa .msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;padding:26px 34px;background:#fff;border:4px solid #ffcc00;border-radius:20px;box-shadow:0 12px 44px rgba(0,0,0,.22);max-width:92vw}
  #festa .msg h2{margin:0 0 10px;font-size:32px;color:#178a3d}
  #festa .msg p{margin:4px 0;font-size:16px;color:#2b2b33}
  #festa .msg .feito{margin-top:14px;font-size:40px;letter-spacing:6px}
  #festa .msg small{display:block;margin-top:10px;color:#888}
  .balao{position:absolute;bottom:-90px;font-size:46px;animation:sobe linear forwards;will-change:transform}
  @keyframes sobe{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-125vh) rotate(14deg)}}
  .confete{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;opacity:.92;animation:cai linear forwards;will-change:transform}
  @keyframes cai{from{transform:translateY(0) rotate(0)}to{transform:translateY(115vh) rotate(760deg)}}
  .err{background:#fdecea;border:1px solid #f5b7b1;border-radius:6px;padding:8px 10px;font-size:13px}
  .vel{font-weight:600;color:var(--vermelho)}
  a{color:var(--azul)}
  /* ---- autocomplete do municipio (lista propria, aparece ao digitar) ---- */
  #controles .munBox{display:flex;flex-direction:column;font-size:12px;color:#4a4a55;gap:2px;position:relative}
  .sug{position:absolute;top:100%;left:0;right:0;z-index:1200;margin-top:2px;max-height:290px;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;color:#1d1d22;border:1px solid var(--borda);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:13.5px}
  .sug .item{padding:9px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sug .item[aria-selected="true"],.sug .item.sel{background:#e8eef6}
  .detalhe{display:inline-block;margin-top:6px;font-weight:600}
  .sug .item .uf{color:#6b7280}
  .sug .item:hover,.sug .item.sel{background:#e8eef6}
  .sug .item b{color:var(--azul)}
  /* ---- aviso: tem radar na area (irmao da festa) ---- */
  #problema{position:fixed;inset:0;z-index:10001;display:none;background:rgba(20,0,0,.55);cursor:pointer}
  #problema.on{display:flex;align-items:center;justify-content:center}
  #problema .msg{max-width:92vw;text-align:center;padding:26px 34px;background:#2b2b33;color:#fff;border:4px solid var(--vermelho);border-radius:20px;box-shadow:0 12px 44px rgba(0,0,0,.4)}
  #problema .msg .cow{font-size:46px;line-height:1}
  #problema .msg h2{margin:6px 0 10px;font-size:28px;color:#ff8a80}
  #problema .msg p{margin:4px 0;font-size:16px;color:#f2f2f5}
  #problema .msg small{display:block;margin-top:10px;color:#b9b9c4}
  /* ---- responsivo: celular / tablet / desktop ---- */
  @media (max-width: 860px){
    table thead{display:none}
    table, table tbody, table tr, table td{display:block;width:100%}
    table{border-collapse:separate}
    table tr{border:1px solid var(--borda);border-radius:10px;margin:8px 0;padding:8px 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    table td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px}
    table td:before{content:attr(data-label);color:#6b7280;font-size:12px;font-weight:600}
    th{position:static}
  }
  @media (max-width: 720px){
    header{padding:9px 12px}
    header h1{font-size:15px}
    header .sub{font-size:11.5px}
    #controles{flex-direction:column;align-items:stretch;gap:10px;padding:10px 12px}
    #controles label,#controles .munBox{width:100%}
    #controles input[type=text],#controles input[type=number],#controles input[type=range]{width:100%}
    #controles button{width:100%}
    .chk{flex-direction:row!important}
    #mapa{height:52vh;min-height:300px}
    #barra,#resultado{padding-left:12px;padding-right:12px}
    #festa .msg{padding:18px 16px;max-width:94vw}
    #festa .msg h2{font-size:22px}
    #festa .msg .feito{font-size:30px;letter-spacing:4px}
    .balao{font-size:34px}
    header .logo{height:40px}
  }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header>
  <img class="logo" src="bunda-de-urso.png" alt="Bundita de Urso — a base do Bunda de urso">
  <div class="cabTxt">
    <h1>Radar Brasil — consulta por localização</h1>
    <nav class="nav">
      <a href="cadastro.html">Cadastrar radar</a>
      <a href="gestao.html">Administração</a>
    </nav>
  </div>
</header>

<div id="controles">
  <div class="munBox">
    <label for="mun">Município</label>
    <input id="mun" type="text" placeholder="digite o município…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugMun">
    <div id="sugMun" class="sug" role="listbox" hidden></div>
  </div>
  <label>Latitude<input id="lat" type="text" inputmode="decimal" placeholder="-17.625377"></label>
  <label>Longitude<input id="lon" type="text" inputmode="decimal" placeholder="-51.060863"></label>
  <label class="raioBox">Raio: <span class="raioVal" id="raioVal">2,0 km</span>
    <input id="raio" type="range" min="0" max="11" step="1" value="3" aria-label="raio (escala de 200 m a 1000 km)">
  </label>
  <button id="btConsultar">Consultar</button>
  <button id="btLocal" class="sec">Usar minha localização</button>
  <button id="btAqui" class="sec" title="Consulta o centro atual do mapa">Mostrar radares aqui</button>
  <label class="chk"><input type="checkbox" id="autoLocal"> buscar minha localização ao abrir</label>
</div>

<div id="legenda" aria-label="legenda das cores">
  <span class="lg"><i style="background:#ffe08a;border-color:#c0392b"></i> fonte oficial</span>
  <span class="lg"><i style="background:#c4b5fd;border-color:#6d28d9"></i> nossa base (Bundita de Urso)</span>
</div>

<div id="mapaBox">
  <div id="mapa"></div>
  <button id="dicaAqui" type="button">Mostrar radares aqui ▾</button>
</div>
<div id="barra">Informe as coordenadas ou use a localização do navegador.</div>
<div id="resultado"></div>

<div id="festa" role="dialog" aria-live="polite">
  <div class="msg">
    <h2>🎉 EBA! Nada por aqui!</h2>
    <p></p>
    <div class="feito">🎈 🎉 🥳 🎊 🎈</div>
    <small>toque para fechar</small>
  </div>
</div>

<div id="problema" role="alertdialog" aria-live="assertive">
  <div class="msg">
    <div class="cow">🤠</div>
    <h2>Você está com problemas, cowboy!</h2>
    <p></p>
    <small>toque para fechar</small>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";
  var API = "api.pse";
  // Escada de raios: o slider anda em INDICE (0..11), nao em metros, para cobrir
  // de 200 m a 1000 km mantendo o ajuste fino nos valores pequenos.
  var ESCALA = [200, 500, 1000, 2000, 5000, 10000, 20000, 50000,
                100000, 200000, 500000, 1000000];
  var map = L.map("mapa").setView([-15.78, -47.93], 4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  var camadaPts = L.layerGroup().addTo(map);
  var marcaEu = null;

  // ---- "Mostrar radares aqui": consulta o CENTRO atual do mapa ----
  function consultarCentroMapa(){
    var c = map.getCenter();
    var lat = +c.lat.toFixed(6), lon = +c.lng.toFixed(6);
    var elLat2 = document.getElementById("lat"), elLon2 = document.getElementById("lon");
    elLat2.value = lat; elLon2.value = lon;
    consultar(lat, lon, raioAtual());
    var dica = document.getElementById("dicaAqui");
    if (dica) dica.classList.remove("on");
  }
  // controle dentro do mapa (canto superior direito)
  var CtrlAqui = L.Control.extend({
    options: {position: "topright"},
    onAdd: function(){
      var d = L.DomUtil.create("div", "ctrlAqui");
      var b = L.DomUtil.create("button", "", d);
      b.type = "button";
      b.textContent = "Mostrar radares aqui";
      L.DomEvent.disableClickPropagation(d);
      L.DomEvent.on(b, "click", consultarCentroMapa);
      return d;
    }
  });
  map.addControl(new CtrlAqui());

  // ---- festa: sem equipamento no raio = motivo de comemorar ----
  var FESTA_EMOJIS = ["🎈","🎈","🎈","🎈","🎉","🎊","🥳","🎈","🎈"];
  var FESTA_CORES  = ["#ff6b6b","#feca57","#48dbfb","#1dd1a1","#f368e0","#54a0ff","#ff9ff3"];

  // ---- a NOSSA base (Bundita de Urso) tem cor propria ----
  var NOSSA_FONTE = "Bundita de Urso - A base do Bunda de urso";
  function ehNosso(p){
    var fs = (p && p.fontes) || [];
    for (var i=0;i<fs.length;i++){
      var n = fs[i] && fs[i].nome;
      if (n === NOSSA_FONTE) return true;
      if (n && n.indexOf("Bundita de Urso") === 0) return true;
    }
    return false;
  }
  function festa(raio, cobertura){
    var el = document.getElementById("festa");
    if (!el) return;
    var txt = "Nenhum equipamento de fiscalização num raio de <b>" + fmtRaio(raio) + "</b>.<br>";
    if (cobertura === "sem_cobertura"){
      el.querySelector(".msg h2").textContent = "🎈 Nada por aqui…";
      txt += "Mas atenção: <b>esta região não tem fonte oficial cadastrada</b> — isso não garante que não exista radar.";
    } else {
      el.querySelector(".msg h2").textContent = "🎉 EBA! Nada por aqui!";
      txt += "Olha que beleza — pode passar tranquilo!";
    }
    el.querySelector(".msg p").innerHTML = txt;
    var antigos = el.querySelectorAll(".balao, .confete");
    for (var k=0;k<antigos.length;k++) el.removeChild(antigos[k]);
    for (var i=0;i<18;i++){
      var b = document.createElement("div");
      b.className = "balao";
      b.textContent = FESTA_EMOJIS[i % FESTA_EMOJIS.length];
      b.style.left = Math.round(Math.random()*95) + "%";
      b.style.animationDuration = (4 + Math.random()*4).toFixed(1) + "s";
      b.style.animationDelay = (Math.random()*1.8).toFixed(1) + "s";
      el.appendChild(b);
    }
    for (var j=0;j<46;j++){
      var c = document.createElement("div");
      c.className = "confete";
      c.style.left = Math.round(Math.random()*100) + "%";
      c.style.background = FESTA_CORES[j % FESTA_CORES.length];
      c.style.animationDuration = (2.6 + Math.random()*3).toFixed(1) + "s";
      c.style.animationDelay = (Math.random()*2.4).toFixed(1) + "s";
      el.appendChild(c);
    }
    el.classList.add("on");
    clearTimeout(festa._t);
    festa._t = setTimeout(function(){ el.classList.remove("on"); }, 7500);
  }
  document.getElementById("festa").addEventListener("click", function(){ this.classList.remove("on"); });

  // ---- aviso: apareceu radar no raio (irmao bem menos alegre da festa) ----
  // Mostra no MAXIMO 1 vez por visita/aba (flag em sessionStorage), para nao
  // subir a cada consulta com radar.
  function problemaCowboy(n, raio){
    var el = document.getElementById("problema");
    if (!el) return;
    var jaMostrou = false;
    try { jaMostrou = sessionStorage.getItem("radarCowboy") === "1"; } catch (e) {}
    if (jaMostrou) return;
    try { sessionStorage.setItem("radarCowboy", "1"); } catch (e) {}
    el.querySelector(".msg p").innerHTML =
      "Tem <b>" + n + "</b> equipamento(s) de fiscalização num raio de <b>" +
      fmtRaio(raio) + "</b>.<br>Segura a velocidade — radar na área!";
    el.classList.add("on");
    clearTimeout(problemaCowboy._t);
    problemaCowboy._t = setTimeout(function(){ el.classList.remove("on"); }, 5200);
  }
  document.getElementById("problema").addEventListener("click", function(){ this.classList.remove("on"); });

  var elLat = document.getElementById("lat");
  var elLon = document.getElementById("lon");
  var elRaio = document.getElementById("raio");
  var elBarra = document.getElementById("barra");
  var elRes = document.getElementById("resultado");
  var elRaioVal = document.getElementById("raioVal");
  var circleRaio = null;
  var ultimo = null;      // ultima posicao consultada
  var reTimer = null;

  function fmtRaio(m){
    if (m >= 1000){
      var km = m / 1000;
      return (km >= 10 ? Math.round(km) : km.toFixed(1).replace(".", ",")) + " km";
    }
    return m + " m";
  }
  // Raio (em metros) correspondente ao indice atual do slider.
  function raioAtual(){
    var i = parseInt(elRaio.value, 10);
    if (isNaN(i) || i < 0) i = 0;
    if (i >= ESCALA.length) i = ESCALA.length - 1;
    return ESCALA[i];
  }
  // Indice da escada mais proximo de um raio em metros (para ?raio= da URL).
  function idxMaisProximo(m){
    var melhor = 0, dif = Infinity;
    for (var i=0;i<ESCALA.length;i++){
      var d = Math.abs(ESCALA[i] - m);
      if (d < dif){ dif = d; melhor = i; }
    }
    return melhor;
  }
  // Distancias "human-readable": abaixo de 1 km em metros; de 1 km pra cima em km.
  function fmtDist(m){
    if (m == null) return "—";
    m = Number(m);
    if (!isFinite(m)) return "—";
    if (m < 1000) return Math.round(m) + " m";
    var s = (m / 1000).toFixed(2).replace(/\.?0+$/, "");
    return s.replace(".", ",") + " km";
  }
  function desenharCirculo(lat, lon, raio){
    if (circleRaio){ map.removeLayer(circleRaio); circleRaio = null; }
    if (lat == null || lon == null) return;
    circleRaio = L.circle([lat, lon], {
      radius: raio, color: "#12508f", weight: 1.5, dashArray: "5,5",
      fillColor: "#9ecbff", fillOpacity: 0.10
    }).addTo(map);
  }
  function enquadrar(lat, lon, raio){
    map.fitBounds(L.latLng(lat, lon).toBounds(raio * 2), {padding: [24, 24]});
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function velDoPonto(p){
    var v = p.velocidades_resolvidas || [];
    for (var i=0;i<v.length;i++){
      if (v[i] && v[i].velocidade_kmh != null && (v[i].categoria === "geral" || v.length === 1))
        return v[i].velocidade_kmh;
    }
    if (v.length && v[0].velocidade_kmh != null) return v[0].velocidade_kmh;
    var l = p.limites_velocidade || [];
    if (l.length && l[0].velocidade_kmh != null) return l[0].velocidade_kmh;
    return null;
  }

  function sentidoDoPonto(p){
    var f = p.faixas || [];
    if (f.length && f[0].sentido) return f[0].sentido;
    return null;
  }

  function popupHtml(p){
    var loc = p.localizacao || {};
    var via = loc.via || {};
    var viaTxt = [via.codigo, via.nome].filter(Boolean).join(" · ") || "(via não informada)";
    var km = (loc.km != null) ? ("km " + loc.km) : "";
    var vel = velDoPonto(p);
    var s = sentidoDoPonto(p);
    var h = "<b>" + escapeHtml(p.id) + "</b>";
    if (ehNosso(p)) h += " <span class='selo-nosso'>Bundita de Urso</span>";
    h += "<br>";
    h += escapeHtml(viaTxt) + (km ? " — " + escapeHtml(km) : "") + "<br>";
    if (vel != null) h += "Velocidade: <span class='vel'>" + escapeHtml(vel) + " km/h</span><br>";
    if (s) h += "Sentido: " + escapeHtml(s) + "<br>";
    if (loc.distancia_metros != null) h += "Distância: " + fmtDist(loc.distancia_metros) + "<br>";
    if (loc.qualidade) h += "Qualidade da posição: " + escapeHtml(loc.qualidade) + "<br>";
    h += "<a class='detalhe' href='detalhe.html?id=" + encodeURIComponent(p.id) + "'>Ver todos os detalhes &raquo;</a>";
    return h;
  }

  function render(meta, pontos){
    camadaPts.clearLayers();
    var linhas = [];
    pontos.forEach(function(p){
      var loc = p.localizacao || {};
      var lat = loc.latitude, lon = loc.longitude;
      var nosso = ehNosso(p);
      var cor = nosso ? "#6d28d9" : "#c0392b";
      var miolo = nosso ? "#c4b5fd" : "#ffe08a";
      if (lat != null && lon != null){
        var m = L.circleMarker([lat, lon], {radius: nosso ? 9 : 7, color:cor, weight:2, fillColor:miolo, fillOpacity:0.95});
        m.bindPopup(popupHtml(p));
        m.addTo(camadaPts);
      }
      var via = (loc.via || {});
      var vel = velDoPonto(p);
      linhas.push("<tr>" +
        "<td data-label='ID'><a class='detalhe' href='detalhe.html?id=" + encodeURIComponent(p.id) + "'><b>" + escapeHtml(p.id) + "</b></a></td>" +
        "<td data-label='Via'>" + escapeHtml([via.codigo, via.nome].filter(Boolean).join(" · ") || "—") + "</td>" +
        "<td data-label='km'>" + (loc.km != null ? escapeHtml(loc.km) : "—") + "</td>" +
        "<td data-label='Velocidade'>" + (vel != null ? "<span class='vel'>" + escapeHtml(vel) + "</span>" : "—") + "</td>" +
        "<td data-label='Sentido'>" + escapeHtml(sentidoDoPonto(p) || "—") + "</td>" +
        "<td data-label='Distância'>" + fmtDist(loc.distancia_metros) + "</td>" +
        "<td data-label='Posição'>" + escapeHtml(loc.qualidade || "—") + "</td>" +
        "</tr>");
    });
    var tabela = "";
    if (pontos.length){
      tabela = "<table><thead><tr><th>ID</th><th>Via</th><th>km</th><th>Velocidade</th><th>Sentido</th><th>Distância</th><th>Posição</th></tr></thead><tbody>" +
        linhas.join("") + "</tbody></table>";
    }
    var st = (meta && meta.status) || "?";
    var resumo = "<span class='pill'>" + escapeHtml(st) + "</span> " +
      "<b>" + (meta ? meta.total_pontos : 0) + "</b> ponto(s) de fiscalização no raio";
    if (meta && meta.total_equipamentos != null) resumo += " · " + meta.total_equipamentos + " equipamento(s)";
    if (meta && meta.proximo_cursor){
      resumo += " <span class='aviso' style='display:inline-block'>mostrando os " +
        (meta.retornados || 0) + " mais próximos de " + (meta.total_pontos || 0) +
        " — reduza o raio para ver todos</span>";
    }
    elRes.innerHTML = resumo + tabela;
  }

  function consultar(lat, lon, raio){
    if (lat == null || lon == null || isNaN(lat) || isNaN(lon)){
      elRes.innerHTML = "<div class='err'>Informe latitude e longitude numéricas.</div>";
      return;
    }
    elBarra.innerHTML = "Consultando " + lat + ", " + lon + " (raio " + raio + " m)…";
    camadaPts.clearLayers();
    if (marcaEu) map.removeLayer(marcaEu);
    marcaEu = L.circleMarker([lat, lon], {radius:8, color:"#12508f", weight:3, fillColor:"#9ecbff", fillOpacity:1})
      .addTo(map).bindPopup("Sua consulta");
    ultimo = {lat: lat, lon: lon};
    desenharCirculo(lat, lon, raio);
    enquadrar(lat, lon, raio);
    var url = API + "?rota=" + encodeURIComponent("/api/v1/radares") +
      "&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon) +
      "&raio=" + encodeURIComponent(raio) + "&formato=json";
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      if (!d || d.sucesso === false){
        var msg = (d && d.erro && d.erro.mensagem) || "falha na consulta";
        elRes.innerHTML = "<div class='err'>" + escapeHtml(msg) + "</div>";
        elBarra.textContent = "";
        return;
      }
      var res = d.resultado || {};
      var pontos = res.pontos || [];
      render(res, pontos);
      if (pontos.length === 0) festa(raio, res.status);
      else problemaCowboy(pontos.length, raio);
      elBarra.innerHTML = "Snapshot " + escapeHtml(d.consultado_em || "") +
        (pontos.length === 0 ? " — <span class='aviso' style='display:inline-block'>nada no raio informado (isso não afirma que não exista radar: verifique cobertura da região).</span>" : "");
    }).catch(function(e){
      elRes.innerHTML = "<div class='err'>Erro de rede: " + escapeHtml(e.message) + "</div>";
      elBarra.textContent = "";
    });
  }

  function usarLocalizacao(){
    if (!navigator.geolocation){ elRes.innerHTML = "<div class='err'>Navegador sem geolocalização.</div>"; return; }
    elBarra.textContent = "Obtendo localização do navegador…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = +pos.coords.latitude.toFixed(6), lon = +pos.coords.longitude.toFixed(6);
      elLat.value = lat; elLon.value = lon;
      var r = raioAtual();
      consultar(lat, lon, r);
    }, function(err){
      elRes.innerHTML = "<div class='err'>Não foi possível obter a localização: " + escapeHtml(err.message) + "</div>";
      elBarra.textContent = "";
    }, {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
  }

  document.getElementById("btConsultar").addEventListener("click", function(){
    consultar(parseFloat(elLat.value), parseFloat(elLon.value), raioAtual());
  });
  document.getElementById("btLocal").addEventListener("click", usarLocalizacao);
  document.getElementById("btAqui").addEventListener("click", consultarCentroMapa);
  document.getElementById("dicaAqui").addEventListener("click", consultarCentroMapa);
  // ao navegar (arrastar/zoom) o mapa, mostra a dica "mostrar radares aqui"
  map.on("movestart", function(){ var d=document.getElementById("dicaAqui"); if (d) d.classList.add("on"); });
  document.getElementById("autoLocal").addEventListener("change", function(e){
    if (e.target.checked) usarLocalizacao();
  });
  // Enter nos campos dispara a consulta
  [elLat, elLon, elRaio].forEach(function(el){
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter") consultar(parseFloat(elLat.value), parseFloat(elLon.value), raioAtual());
    });
  });

  // ---- combo de municipio: digite o nome e escolha na lista ----
  var elMun = document.getElementById("mun");
  var elSug = document.getElementById("sugMun");
  var MUNICIPIOS = [];
  var selIdx = -1;

  function semAcento(s){
    return String(s == null ? "" : s).normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  fetch("municipios.json").then(function(r){ return r.json(); }).then(function(lista){
    MUNICIPIOS = lista || [];
    for (var i=0;i<MUNICIPIOS.length;i++){          // chaves de busca prontas
      MUNICIPIOS[i].n0 = semAcento(MUNICIPIOS[i].n);
      MUNICIPIOS[i].k = MUNICIPIOS[i].n0 + " " + semAcento(MUNICIPIOS[i].u);
    }
  }).catch(function(){ /* sem a lista o combo fica inerte; a pagina segue normal */ });

  function fecharSug(){
    elSug.hidden = true; elSug.innerHTML = ""; elSug._res = null; selIdx = -1;
    elMun.setAttribute("aria-expanded", "false");
  }
  function marcarSug(itens){
    for (var i=0;i<itens.length;i++) itens[i].classList.toggle("sel", i === selIdx);
    if (selIdx >= 0 && itens[selIdx] && itens[selIdx].scrollIntoView)
      itens[selIdx].scrollIntoView({block:"nearest"});
  }

  // Monta a lista com os nomes conforme digita (comeca-por antes de contem).
  function abrirSug(){
    var q = semAcento(elMun.value.trim());
    if (!MUNICIPIOS.length){ elSug.hidden = true; return; }
    var starts = [], contem = [];
    if (q){
      for (var i=0;i<MUNICIPIOS.length;i++){
        var m = MUNICIPIOS[i];
        if (m.n0.indexOf(q) === 0){
          starts.push(m);
          if (starts.length >= 12) break;
        } else if (contem.length < 12 && m.k.indexOf(q) >= 0){
          contem.push(m);
        }
      }
    }
    var res = starts.concat(contem).slice(0, 12);
    if (!res.length){ fecharSug(); return; }
    selIdx = -1;
    var h = "";
    for (var j=0;j<res.length;j++){
      h += "<div class='item' data-i='" + j + "' role='option'>" +
        escapeHtml(res[j].n) + " <span class='uf'>/ " + escapeHtml(res[j].u) + "</span></div>";
    }
    elSug.innerHTML = h;
    elSug._res = res;
    elSug.hidden = false;
    elMun.setAttribute("aria-expanded", "true");
  }

  function escolherSug(m){
    elMun.value = m.n + " / " + m.u;
    fecharSug();
    elLat.value = m.a; elLon.value = m.o;
    elBarra.textContent = "Município " + m.n + "/" + m.u + " …";
    consultar(m.a, m.o, raioAtual());
  }

  function irParaMunicipio(){
    var txt = (elMun.value || "").trim();
    if (!txt || !MUNICIPIOS.length) return;
    var partes = txt.split("/");
    var nome = semAcento(partes[0].trim());
    var uf = (partes[1] || "").trim().toUpperCase();
    var achou = null, cands = [];
    for (var i=0;i<MUNICIPIOS.length;i++){
      var m = MUNICIPIOS[i];
      if (m.n0 === nome && (!uf || m.u === uf)){ achou = m; break; }
      if (m.n0.indexOf(nome) === 0) cands.push(m);
    }
    if (!achou && cands.length === 1) achou = cands[0];
    if (!achou) return;
    escolherSug(achou);
  }

  elMun.addEventListener("input", abrirSug);
  elMun.addEventListener("focus", abrirSug);
  elMun.addEventListener("keydown", function(e){
    var itens = elSug.hidden ? [] : elSug.querySelectorAll(".item");
    if (!itens.length){
      if (e.key === "Enter"){ e.preventDefault(); irParaMunicipio(); }
      return;
    }
    if (e.key === "ArrowDown"){ e.preventDefault(); selIdx = (selIdx + 1) % itens.length; marcarSug(itens); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); selIdx = (selIdx - 1 + itens.length) % itens.length; marcarSug(itens); }
    else if (e.key === "Enter"){
      e.preventDefault();
      if (selIdx >= 0 && elSug._res && elSug._res[selIdx]) escolherSug(elSug._res[selIdx]);
      else irParaMunicipio();
    }
    else if (e.key === "Escape"){ fecharSug(); }
  });
  elSug.addEventListener("mousedown", function(e){
    var it = e.target && e.target.closest ? e.target.closest(".item") : null;
    if (!it) return;
    e.preventDefault();                       // nao rouba o foco do input
    var i = parseInt(it.getAttribute("data-i"), 10);
    if (elSug._res && elSug._res[i]) escolherSug(elSug._res[i]);
  });
  document.addEventListener("click", function(e){
    if (elSug.hidden) return;
    if (e.target && e.target.closest && e.target.closest(".munBox")) return;
    fecharSug();
  });
  // Slider do raio: arrasta e o mapa/circulo acompanham; solta e consulta de novo
  elRaioVal.textContent = fmtRaio(raioAtual());
  // mantem o mapa justo quando a tela muda de tamanho/rotacao (celular)
  window.addEventListener("resize", function(){ setTimeout(function(){ map.invalidateSize(); }, 200); });
  window.addEventListener("orientationchange", function(){ setTimeout(function(){ map.invalidateSize(); }, 350); });
  var pendente = null;   // hoisted no IIFE; guarda a consulta agendada
  elRaio.addEventListener("input", function(){
    // ENQUANTO ARRASTA: so o visual acompanha (numero + circulo); NAO consulta.
    var r = raioAtual();
    elRaioVal.textContent = fmtRaio(r);
    if (ultimo){
      desenharCirculo(ultimo.lat, ultimo.lon, r);
      enquadrar(ultimo.lat, ultimo.lon, r);
    }
    if (pendente){ clearTimeout(pendente); pendente = null; }
    elBarra.textContent = "Ajustando o raio… solte para consultar.";
  });
  elRaio.addEventListener("change", function(){
    // SOLTOU a barrinha: conta 1s e so entao consulta.
    var r = raioAtual();
    if (pendente) clearTimeout(pendente);
    pendente = setTimeout(function(){
      pendente = null;
      if (ultimo) consultar(ultimo.lat, ultimo.lon, r);
    }, 1000);
  });
  // Link direto: ?lat=..&lon=..&raio=..  (consulta sozinho)
  //            ?local=1             (usa a localização do navegador)
  var qp = new URLSearchParams(location.search);
  if (qp.has("lat") && qp.has("lon")){
    elLat.value = qp.get("lat"); elLon.value = qp.get("lon");
    if (qp.has("raio")){
      var _m = parseInt(qp.get("raio"), 10);
      if (!isNaN(_m)) elRaio.value = idxMaisProximo(_m);
    }
    elRaioVal.textContent = fmtRaio(raioAtual());
    consultar(parseFloat(elLat.value), parseFloat(elLon.value), raioAtual());
  } else if (qp.has("local")){
    usarLocalizacao();
  } else {
    // exemplo de GO, só para abrir já com algo preenchido
    elLat.value = "-17.625377"; elLon.value = "-51.060863";
  }
})();
</script>
</body>
</html>
