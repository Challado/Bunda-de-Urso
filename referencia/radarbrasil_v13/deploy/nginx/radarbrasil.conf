# Incluir em server { ... } existente, adequar path e socket fcgiwrap.
# Não exponha scripts Python pelo handler de PHP; exclusivamente pelo fcgiwrap.
location = /radar/api.pse {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/radarbrasil/web/api.pse;
    fastcgi_param SCRIPT_NAME /radar/api.pse;
    fastcgi_param PATH_INFO /api/v1/radares;
    fastcgi_param PATH /opt/radarbrasil/.venv/bin:/usr/local/bin:/usr/bin:/bin;
    fastcgi_pass unix:/run/fcgiwrap.socket;
}
location ^~ /api/v1/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/radarbrasil/web/api.pse;
    fastcgi_param SCRIPT_NAME /api.pse;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param PATH /opt/radarbrasil/.venv/bin:/usr/local/bin:/usr/bin:/bin;
    fastcgi_pass unix:/run/fcgiwrap.socket;
}
location = /health/live {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/radarbrasil/web/api.pse;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param PATH /opt/radarbrasil/.venv/bin:/usr/local/bin:/usr/bin:/bin;
    fastcgi_pass unix:/run/fcgiwrap.socket;
}
